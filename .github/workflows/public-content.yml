name: Public content checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This job never receives production credentials or calls the real Backend.
      BACKEND_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check route registration and article contracts
        run: npm test -- src/app/search-discovery.test.ts src/components/public-reading-articles.test.tsx
      - run: npm run build
      - run: npm run test:public-content
