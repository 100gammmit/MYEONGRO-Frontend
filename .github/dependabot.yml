version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go through dev like every other change; main deploys straight to production.
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # eslint-config-next must match the Next.js version it lints.
      next:
        patterns:
          - next
          - eslint-config-next
