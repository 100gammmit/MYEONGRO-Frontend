version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - test -n "$BACKEND_API_URL"
        - printf 'BACKEND_API_URL=%s\n' "$BACKEND_API_URL" > .env.production
        - printf 'NEXT_PUBLIC_ADSENSE_CLIENT=%s\n' "${NEXT_PUBLIC_ADSENSE_CLIENT:-}" >> .env.production
        - npm run lint
        - npm run typecheck
        - npm test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
